# Compose untuk DEVELOPMENT / build lokal.
# Build image dari source dan jalankan. QR muncul di log container.

# Pin nama project -> semua resource (network, dll) di-namespace "wagagent_..."
# berapapun nama foldernya, jadi tidak tercampur stack lain.
name: wagagent

services:
  # Gateway LLM 9Router. WagAgent memanggilnya via http://9router:20128/v1
  9router:
    image: ${NINEROUTER_IMAGE:-decolua/9router:latest}
    container_name: 9router
    restart: unless-stopped
    environment:
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - DATA_DIR=/app/data
      # Password login dashboard. Default image: 123456. Ganti lewat .env: NINEROUTER_PASSWORD=...
      - INITIAL_PASSWORD=${NINEROUTER_PASSWORD:-123456}
      - JWT_SECRET=${NINEROUTER_JWT_SECRET:-please-change-this-secret}
    volumes:
      - ./9router-data:/app/data
    networks:
      - wagagent
    # Dashboard hanya ke localhost (akses via SSH tunnel bila di VM).
    ports:
      - "127.0.0.1:20128:20128"

  wagagent:
    build:
      context: .
      dockerfile: Dockerfile
    image: wagagent:local
    container_name: wagagent
    restart: unless-stopped
    depends_on:
      - 9router
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    # tty agar QR code (yang digambar ke terminal) tampil rapi di `docker compose logs`.
    tty: true
    # Hanya pakai network milik stack ini. Tidak publish port apa pun
    # (aplikasi hanya koneksi keluar), jadi tidak ada bentrok port.
    networks:
      - wagagent

networks:
  wagagent:
    # Tanpa "name:" eksplisit -> Compose memberi prefix project: "wagagent_wagagent".
    # Terisolasi dari network stack/compose lain di host yang sama.
    driver: bridge
