# Satu compose untuk DUA mode:
#
#   A) BUILD dari source (laptop / VM manual):
#        docker compose up -d --build
#      -> image dibangun lokal (tag: wagagent:local). WAGAGENT_IMAGE tidak perlu diisi.
#
#   B) PULL image dari Docker Hub (jalur CI/CD):
#        set WAGAGENT_IMAGE di .env, lalu:
#        docker compose pull && docker compose up -d
#      -> image ditarik dari registry, tidak build.
#
# Pin nama project -> resource di-namespace "wagagent_...", tidak tercampur stack lain.
name: wagagent

services:
  # Gateway LLM 9Router. WagAgent memanggilnya via http://9router:20128/v1
  9router:
    image: ${NINEROUTER_IMAGE:-decolua/9router:latest}
    container_name: 9router
    restart: unless-stopped
    environment:
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - DATA_DIR=/app/data
      # Password login dashboard. Default image: 123456. Ganti lewat .env: NINEROUTER_PASSWORD=...
      - INITIAL_PASSWORD=${NINEROUTER_PASSWORD:-123456}
      - JWT_SECRET=${NINEROUTER_JWT_SECRET:-please-change-this-secret}
    volumes:
      - ./9router-data:/app/data
    networks:
      - wagagent
    # Dashboard hanya diikat ke localhost (akses via SSH tunnel), TIDAK ke publik.
    ports:
      - "127.0.0.1:20128:20128"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  wagagent:
    build:
      context: .
      dockerfile: Dockerfile
    # Mode A (build): default "wagagent:local". Mode B (pull): isi WAGAGENT_IMAGE di .env.
    image: ${WAGAGENT_IMAGE:-wagagent:local}
    container_name: wagagent
    restart: unless-stopped
    depends_on:
      - 9router
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    # tty agar QR code (digambar ke terminal) tampil rapi di `docker compose logs`.
    tty: true
    networks:
      - wagagent
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  wagagent:
    # Nama efektif "wagagent_wagagent"; terisolasi dari network stack lain.
    driver: bridge
